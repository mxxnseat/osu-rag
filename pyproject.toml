[project]
name = "osu-rag"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "blake3>=1.0.11",
    "fastapi-injectable>=1.6.2",
    "fastapi[standard]>=0.165.0",
    "flash-linear-attention>=0.6.0",
    "huggingface-hub>=2.4.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sentence-transformers>=6.3.0",
    "sqlmodel>=0.0.50",
    "torch>=2.15.0",
    "triton-windows>=3.9.0.post30",
    "wenmode>=0.15.3",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132" }]
